name: Test action

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup ConnectIQ SDK
        id: connectiq
        uses: ./

      - name: Verify installation
        shell: bash
        run: |
          test -n "${CONNECT_IQ_HOME}"
          test -f "${CONNECT_IQ_HOME}/bin/monkeybrains.jar"
          command -v monkeyc
          monkeyc --version
          test -d "${HOME}/.Garmin/ConnectIQ/Devices"
          echo "Installed SDK ${{ steps.connectiq.outputs.sdk-version }} at ${{ steps.connectiq.outputs.sdk-path }}"
