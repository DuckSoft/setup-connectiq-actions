name: Test action

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup ConnectIQ SDK
        id: connectiq
        uses: ./

      - name: Verify installation
        shell: bash
        run: |
          test -n "${CONNECT_IQ_HOME}"
          test -f "${CONNECT_IQ_HOME}/bin/monkeybrains.jar"
          command -v monkeyc
          monkeyc --version
          test -d "${HOME}/.Garmin/ConnectIQ/Devices"
          echo "Installed SDK ${{ steps.connectiq.outputs.sdk-version }} at ${{ steps.connectiq.outputs.sdk-path }}"

  simulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./
        with:
          sdk-version: "9.2.0"
          install-simulator-dependencies: "true"
      - name: Compile and execute simulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/test-key.pem"
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/test-key.pem" -out "$RUNNER_TEMP/test-key.der" -nocrypt
          monkeyc -f tests/simulator/monkey.jungle -d fenix7 -o "$RUNNER_TEMP/smoke.prg" -y "$RUNNER_TEMP/test-key.der" -t
          bash tests/run-simulator-tests.sh "$RUNNER_TEMP/smoke.prg" fenix7 | tee "$RUNNER_TEMP/smoke.log"
          grep -Fq "SETUP_CONNECTIQ_SIMULATOR_SMOKE_EXECUTED" "$RUNNER_TEMP/smoke.log"
      - name: Verify failed tests fail the job command
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/return true;/return false;/' tests/simulator/source/Smoke.mc
          monkeyc -f tests/simulator/monkey.jungle -d fenix7 -o "$RUNNER_TEMP/fail.prg" -y "$RUNNER_TEMP/test-key.der" -t
          if bash tests/run-simulator-tests.sh "$RUNNER_TEMP/fail.prg" fenix7 >"$RUNNER_TEMP/fail.log" 2>&1; then
            cat "$RUNNER_TEMP/fail.log"
            echo "::error::A failing unit test incorrectly returned success."
            exit 1
          fi
          cat "$RUNNER_TEMP/fail.log"
          grep -Fq "SETUP_CONNECTIQ_SIMULATOR_SMOKE_EXECUTED" "$RUNNER_TEMP/fail.log"
          grep -Eq 'FAILED \(passed=0, failed=1 , errors=0\)' "$RUNNER_TEMP/fail.log"
